<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorldSim</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">WS</div>
        <div>
          <div class="brand-name">WorldSim</div>
          <div class="brand-sub">world simulation</div>
        </div>
      </div>
      <label class="world-pick">
        <span>World</span>
        <select id="world-select" aria-label="Current world"></select>
      </label>
      <nav id="nav" class="nav" aria-label="Pages"></nav>
      <div class="sidebar-foot" id="backend-info"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Simulation</h1>
        <div class="topbar-right" id="topbar-right"></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="modal" class="modal"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
